name = "ilmvers-institute"
account_id = "eae4cb41726e4c445429ea97e52044f2"
workers_dev = true
main = "custom-worker.ts"
compatibility_date = "2026-06-27"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "ilmvers.com", custom_domain = true },
  { pattern = "www.ilmvers.com", custom_domain = true },
  { pattern = "admin.ilmvers.com", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[ai]
binding = "AI"

# Public values only. Secrets go in with `wrangler secret put` and are listed in .env.example.
[vars]
NEXT_PUBLIC_SITE_URL = "https://ilmvers.com"
NEXT_PUBLIC_HIFZ_LAB_ENABLED = "false"
EMAIL_FROM = "Ilmvers Institute <noreply@ilmversinstitute.com>"
ADMIN_ALERT_EMAIL = "info@ilmversinstitute.com"
